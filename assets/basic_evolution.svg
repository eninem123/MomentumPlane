<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#f7c59f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="340" fill="url(#bg)"/>
  <text x="400" y="130" text-anchor="middle" font-family="monospace" font-size="28" fill="#e0e0e0">Position Space  -&gt;  Momentum Plane</text>
  <text x="400" y="175" text-anchor="middle" font-family="monospace" font-size="16" fill="#888">scattered wave-packets collapse into sharp diffraction peaks</text>
  <line x1="200" y1="210" x2="600" y2="210" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8,4"/>
  <circle cx="200" cy="210" r="5" fill="#ff6b35"/>
  <circle cx="600" cy="210" r="5" fill="#f7c59f"/>
  <text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="14" fill="#666">Run: python examples/basic_simulation.py</text>
  <text x="400" y="285" text-anchor="middle" font-family="monospace" font-size="13" fill="#555">to generate the animated evolution GIF</text>
  <text x="400" y="320" text-anchor="middle" font-family="monospace" font-size="11" fill="#444">MomentumPlane v0.1.0</text>
</svg>
